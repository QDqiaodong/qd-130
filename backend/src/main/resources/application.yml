server:
  port: ${SERVER_PORT:8330}

spring:
  application:
    name: maternal-equipment
  
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3530}/${DB_NAME:maternal_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6630}
      timeout: 6000ms
  
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.example.maternal: DEBUG
    org.hibernate.SQL: DEBUG
